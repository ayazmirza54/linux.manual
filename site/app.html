<body>

<div class="crt" aria-hidden="true"></div>

<div class="window">

  <header class="titlebar">
    <a class="logo" href="index.html" aria-label="linux.manual home"><span class="logo-ps1" aria-hidden="true">~$</span>linux<span class="logo-dot">.</span>manual</a>
    <div class="titlebar-title" id="titlebar-title">root@localhost: ~/reference</div>
    <div class="titlebar-tools">
      <button class="tool" id="btn-theme" title="Cycle theme (t)"><span id="theme-name">phosphor</span></button>
      <button class="tool" id="btn-crt" title="Toggle CRT effect">crt</button>
      <button class="tool" id="btn-help" title="Keyboard shortcuts (?)">?</button>
      <a class="tool-icon" href="https://github.com/ayazmirza54/linux.manual" target="_blank" rel="noreferrer" title="GitHub" aria-label="GitHub"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2 0 1.9 1.2 1.9 1.2 1 1.8 2.8 1.3 3.5 1 0-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.2.5-2.3 1.3-3.1-.2-.4-.6-1.6 0-3.2 0 0 1-.3 3.4 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.7 1.6.3 2.8.2 3.2.8.8 1.3 1.9 1.3 3.2 0 4.6-2.8 5.6-5.5 5.9.5.4.9 1.1.9 2.3v3.3c0 .3.1.7.8.6A12 12 0 0 0 12 .3"/></svg></a>
    </div>
  </header>

  <div class="body">

    <nav class="sidebar" id="sidebar">
      <div class="nav-group">
        <div class="nav-label">// sections</div>
        <a class="nav-item" href="#/" data-nav="home"><span class="glyph">~</span>home</a>
        <a class="nav-item" href="#/all" data-nav="all"><span class="glyph">$</span>all commands</a>
        <a class="nav-item" href="#/guides" data-nav="guides"><span class="glyph">#</span>guides</a>
        <a class="nav-item" href="#/tips" data-nav="tips"><span class="glyph">!</span>tips</a>
        <a class="nav-item" href="#/random" data-nav="random"><span class="glyph">?</span>random</a>
      </div>
      <div class="nav-group">
        <div class="nav-label">// jump</div>
        <div class="alpha" id="alpha"></div>
      </div>
      <div class="nav-group nav-recent" id="recent-group" hidden>
        <div class="nav-label">// recent</div>
        <div id="recent"></div>
      </div>
      <div class="nav-foot">
        <div><span class="dim">pages</span> <b id="stat-commands">—</b></div>
        <div><span class="dim">guides</span> <b id="stat-guides">—</b></div>
        <div><span class="dim">offline</span> <b class="ok">yes</b></div>
      </div>
    </nav>

    <main class="main">
      <form class="promptbar" id="promptform" autocomplete="off">
        <label class="ps1" for="prompt"><span class="ps1-user">you</span><span class="ps1-at">@</span><span class="ps1-host">linux</span><span class="ps1-path">:~$</span></label>
        <span class="prompt-wrap">
          <input id="prompt" class="prompt-input" type="text" spellcheck="false"
                 placeholder="search commands, or type a command: man tar / guides / theme amber / help"
                 aria-label="Search or run a command">
          <span class="prompt-caret" id="prompt-caret" aria-hidden="true"><span
                class="caret-measure" id="caret-measure"></span><span class="caret-block"></span></span>
        </span>
        <span class="prompt-hint" id="prompt-hint">press <kbd>/</kbd></span>
      </form>

      <div class="suggest" id="suggest" hidden></div>

      <section class="view" id="view" tabindex="-1"></section>
    </main>

  </div>

  <footer class="statusbar">
    <span class="st st-mode" id="st-mode">NORMAL</span>
    <span class="st st-path" id="st-path">~/</span>
    <span class="st st-msg" id="st-msg"></span>
    <span class="st st-spacer"></span>
    <span class="st st-keys"><kbd>/</kbd> search <kbd>g</kbd> guides <kbd>r</kbd> random <kbd>t</kbd> theme <kbd>?</kbd> keys</span>
  </footer>

</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">keyboard shortcuts<button class="tool" id="modal-close">esc</button></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="data/meta.js"></script>
<script src="data/index.js"></script>
<script src="data/basics.js"></script>
<script src="data/tips.js"></script>
<script src="assets/js/markdown.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
